# Pipeline de CI: corre en cada push (lo pide el PDF) y también se puede lanzar a mano.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  # Calidad de código: si el linter o el formato fallan, el pipeline lo marca.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # Suite de API (Petstore).
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm ci instala las versiones exactas de package-lock.json (y descarga Cypress).
      - run: npm ci
      - run: npm run test:api
      # El reporte se publica como artifact siempre, también si los tests fallan
      # (justo cuando más se necesita ver qué pasó).
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-api
          path: cypress/reports
          retention-days: 14

  # Suite de UI (Buggy Cars) en más de un navegador (bonus del PDF).
  # matrix: GitHub crea un job por cada navegador de la lista y los corre EN PARALELO.
  # fail-fast: false → si falla un navegador, los otros siguen (así se ve cuál falló y en cuál no).
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # "--" pasa el parámetro al comando del script: cypress run --spec ... --browser <navegador>
      - run: npm run test:ui -- --browser ${{ matrix.browser }}
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-ui-${{ matrix.browser }}
          path: cypress/reports
          retention-days: 14

  # Colección de Postman equivalente (bonus), ejecutada con Newman.
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:newman

  # Hallazgos: tests que esperan lo que dice la documentación de Petstore y hoy FALLAN
  # porque la API no la cumple (ver docs/hallazgos-api.md). No se fuerzan para que pasen.
  # continue-on-error: el job se ve en rojo con su reporte, pero NO pone en rojo el pipeline,
  # así un error nuevo en los tests estables no queda tapado por fallas que ya conocemos.
  api-hallazgos:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:api:hallazgos
      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-api-hallazgos
          path: cypress/reports
          retention-days: 14
